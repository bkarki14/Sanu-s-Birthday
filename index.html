<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sanu! 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4f9a;--pink2:#ff8cc6;--deep:#d61f69}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;background:#9fd8fb}
.scene{position:fixed;inset:0;overflow:hidden;overflow:clip;transition:opacity 1.4s ease}
.hidden{opacity:0;pointer-events:none}
#s1{background:linear-gradient(#4aa9ef 0%,#8fd0fa 40%,#d9f2ff 68%)}
.bg{position:absolute;inset:0;width:100%;height:100%;z-index:1}

/* sun + clouds */
.sun{position:absolute;left:6%;top:5%;width:clamp(70px,10vw,130px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#fffdf0 0 35%,#ffe680 62%,#ffcf3a 100%);
  box-shadow:0 0 70px 30px rgba(255,226,110,.55);z-index:0;animation:pulse 4s ease-in-out infinite}
.rays{position:absolute;left:calc(6% + clamp(35px,5vw,65px));top:calc(5% + clamp(35px,5vw,65px));width:clamp(220px,30vw,380px);aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;z-index:0;
  background:repeating-conic-gradient(rgba(255,236,150,.5) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);
  animation:spin 40s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 0 90px 40px rgba(255,226,110,.65)}}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.95;z-index:0;filter:drop-shadow(0 6px 8px rgba(80,140,200,.15));animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;top:-80%}
.cloud::after{width:40%;height:130%;left:48%;top:-55%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* title */
.title{position:absolute;top:2.5vh;left:0;right:0;text-align:center;z-index:5;pointer-events:none;padding:0 10px}
.title h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(36px,7vw,86px);line-height:1.25;color:var(--pink);
  text-shadow:0 3px 0 #fff,0 0 18px rgba(255,255,255,.95),0 8px 24px rgba(214,31,105,.35)}
.title h1 .w{display:inline-block;white-space:nowrap;margin:0 .12em}
.title h1 .l{display:inline-block;animation:wave 2.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0)}25%{transform:translateY(-10px) rotate(-4deg)}}
.title p{font-size:clamp(16px,2.5vw,26px);color:#fff;font-weight:800;text-shadow:0 2px 8px rgba(214,31,105,.55);margin-top:-4px}
.title,.ask{opacity:0;animation:fadein 1.2s .3s forwards}
@keyframes fadein{to{opacity:1}}

/* characters */
#cast{position:absolute;left:50%;bottom:1.5vh;width:min(96vw,620px);height:auto;transform:translateX(-50%);z-index:3;pointer-events:none;transition:bottom 1.1s cubic-bezier(.3,1.3,.5,1),width 1.1s ease,left 1.1s ease}
.ask.side{left:auto;right:2vw;width:min(390px,34vw);transform:translate(0,60px) scale(.9)}
.ask.side.show{transform:translate(0,0) scale(1)}
.nm{font:800 19px 'Baloo 2',sans-serif;fill:#d61f69;stroke:#fff;stroke-width:5px;paint-order:stroke;text-anchor:middle}
.bt{font:700 16px 'Baloo 2',sans-serif;fill:#c2185b;text-anchor:middle}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .32s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.flag{transform-box:fill-box;transform-origin:50% 0;animation:flutter 1.4s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:skewX(10deg)}50%{transform:skewX(-10deg)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 4s ease-out infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.7}100%{transform:translate(18px,-70px) scale(2);opacity:0}}

/* ask card */
.ask{position:absolute;left:50%;bottom:1.5vh;transform:translate(-50%,60px) scale(.9);z-index:6;width:min(94vw,540px);
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:3px solid var(--pink2);border-radius:28px;
  padding:16px 18px 12px;text-align:center;box-shadow:0 14px 44px rgba(214,31,105,.28);visibility:hidden;
  transition:transform .9s cubic-bezier(.2,1.5,.4,1),opacity .6s}
.ask.show{visibility:visible;transform:translate(-50%,0) scale(1)}
.ask{overflow:visible}
.ask h2{font-size:clamp(21px,4.6vw,31px);color:var(--deep);line-height:1.15;font-weight:800}
.ask h2 small{display:block;font-size:.55em;color:#e46aa3;font-weight:700;margin-top:2px}
.btns{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:12px;min-height:66px;position:relative;z-index:7}
button{font-family:'Baloo 2',sans-serif;font-weight:800;border:none;cursor:pointer;border-radius:999px;-webkit-tap-highlight-color:transparent}
.yes{font-size:22px;padding:10px 34px;white-space:nowrap;color:#fff;background:linear-gradient(135deg,#ff6fae,#ff2f7d);
  box-shadow:0 6px 0 #c41a5f,0 10px 24px rgba(255,47,125,.45);transition:transform .35s cubic-bezier(.3,1.6,.5,1);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 #c41a5f,0 10px 34px rgba(255,47,125,.75)}}
.yes:active{transform:translateY(3px)}
.no{font-size:17px;padding:9px 22px;color:#7a6070;background:#f3e7ee;box-shadow:0 4px 0 #d9c3cf;transition:transform .4s cubic-bezier(.3,1.5,.5,1),opacity .3s;z-index:7;white-space:nowrap;position:relative}
.no.free{position:fixed}
.no.turned{color:#fff;background:linear-gradient(135deg,#ff6fae,#ff2f7d);box-shadow:0 5px 0 #c41a5f}
.quip{min-height:26px;margin-top:6px;color:#d14786;font-weight:700;font-size:16px}

/* floaty stuff */
.funny{position:fixed;z-index:90;pointer-events:none;white-space:nowrap;font:800 17px 'Baloo 2',sans-serif;color:#d61f69;background:#fff;padding:4px 12px;border-radius:999px;border:2px solid #ff8cc6;box-shadow:0 4px 14px rgba(214,31,105,.25)}
.funny.emo{background:none;border:none;box-shadow:none;font-size:30px;padding:0}
.fx{position:absolute;pointer-events:none;z-index:4;will-change:transform}
.petal{width:12px;height:9px;background:#ffb3d1;border-radius:70% 0 70% 0;opacity:.85}
.burst{position:fixed;left:50%;top:50%;font-size:30px;pointer-events:none;z-index:80}
.yay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:70;pointer-events:none;
  font-family:'Pacifico',cursive;font-size:clamp(46px,11vw,120px);color:#fff;text-shadow:0 0 20px #ff4f9a,0 6px 0 #d61f69;opacity:0;transform:scale(.3);transition:all .7s cubic-bezier(.2,1.6,.4,1);text-align:center}
.yay.on{opacity:1;transform:scale(1)}
.butterfly{position:absolute;z-index:4;font-size:26px;pointer-events:none}
.b1{left:20%;bottom:28%;animation:fly1 11s ease-in-out infinite}
.b2{right:18%;bottom:34%;animation:fly2 13s ease-in-out infinite}
@keyframes fly1{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(90px,-60px) rotate(10deg)}50%{transform:translate(30px,-120px)}75%{transform:translate(-60px,-40px) rotate(8deg)}}
@keyframes fly2{0%,100%{transform:translate(0,0) scaleX(-1)}30%{transform:translate(-80px,-50px) scaleX(-1)}60%{transform:translate(-20px,-110px) scaleX(-1)}80%{transform:translate(50px,-30px) scaleX(-1)}}

/* scene 2 */
#s2{background:#ffd1df}
#s2 .nm{display:none}
.top2{position:absolute;top:2.5vh;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
.top2 h2{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(28px,5.5vw,62px);color:#fff;text-shadow:0 0 14px #ff4f9a,0 4px 0 #e0457f}
.top2 p{font-weight:800;color:#fff;font-size:clamp(15px,2.2vw,22px);text-shadow:0 2px 8px rgba(120,40,90,.5)}
.love{position:absolute;bottom:2.5vh;left:0;right:0;text-align:center;z-index:6;font-family:'Pacifico',cursive;
  font-size:clamp(38px,7.5vw,88px);color:#fff;text-shadow:0 0 12px #ff4f9a,0 0 34px #ff4f9a,0 5px 0 #d61f69;animation:beat 1.3s ease-in-out infinite;pointer-events:none}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
.replay{position:absolute;right:12px;top:10px;z-index:9;background:rgba(255,255,255,.75);color:var(--deep);font-size:14px;padding:6px 14px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.music{position:absolute;left:12px;top:10px;z-index:9;background:rgba(255,255,255,.8);color:var(--deep);font-size:14px;padding:6px 14px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.music.off{opacity:.7}
.sunrays{animation:sunspin 40s linear infinite}
@keyframes sunspin{to{transform:rotate(360deg)}}
.pg{animation:glide linear infinite}
@keyframes glide{from{transform:translate(-200px,0)}to{transform:translate(1800px,70px)}}
.bird{animation:birds 26s linear infinite}
@keyframes birds{from{transform:translate(1700px,0)}to{transform:translate(-200px,-40px)}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3.2s ease-out infinite}
@keyframes ripple{from{transform:scale(.7);opacity:.7}to{transform:scale(1.35);opacity:0}}
.glint{animation:glint 2.6s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.15}50%{opacity:.9}}
@media (max-width:600px){.top2{top:calc(2vh + 38px)}.music,.replay{font-size:12.5px;padding:5px 11px}}
</style>
</head>
<body>

<!-- shared defs -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="dhaka" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#b8202e"/><path d="M5 0 L10 5 L5 10 L0 5Z" fill="#1d1d1d"/>
      <circle cx="5" cy="5" r="1.7" fill="#ffd23f"/><rect width="2" height="2" fill="#fff"/>
    </pattern>
  </defs>
</svg>

<!-- ============ PAGE 1 ============ -->
<section class="scene" id="s1">
  <div class="rays"></div><div class="sun"></div>
  <div class="cloud" style="top:9%;width:150px;height:44px;animation-duration:70s;animation-delay:-20s"></div>
  <div class="cloud" style="top:20%;width:110px;height:34px;animation-duration:55s;animation-delay:-42s"></div>
  <div class="cloud" style="top:14%;width:190px;height:52px;animation-duration:90s;animation-delay:-65s"></div>
  <div class="cloud" style="top:27%;width:90px;height:28px;animation-duration:48s;animation-delay:-8s;opacity:.8"></div>

  <svg class="bg" id="bg1" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"></svg>

  <div class="title">
    <h1 id="ttl">Happy Birthday Sanu! 💖</h1>
      </div>

  <div class="butterfly b1">🦋</div><div class="butterfly b2">🦋</div>

  <svg id="cast" viewBox="0 0 600 380"></svg>

  <div class="ask" id="ask">
    <h2>Sanu, do you wanna go on a date with me? 😊😉<small>(choose wisely!)</small></h2>
    <div class="btns">
      <button class="yes" id="yes">Yes 💖</button>
      <button class="no" id="no">No</button>
    </div>
    <div class="quip" id="quip"></div>
  </div>
</section>

<!-- ============ PAGE 2 ============ -->
<section class="scene hidden" id="s2">
  <svg class="bg" id="bg2" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"></svg>
  <div class="top2">
    <h2>Happy Birthday, Suruchi 🎂</h2>
    <p>Phewa Tal, Pokhara 🏔️🚣‍♀️</p>
  </div>
  <div class="love">I love you <span id="cnt">0</span> :) 🫶</div>
  <button class="replay" onclick="location.reload()">↺ replay</button>
  <button class="music" id="music">🎵 Bhanai · Tribal Rain</button>
</section>

<div id="ytwrap" style="position:fixed;left:-500px;top:0;width:200px;height:200px;overflow:hidden" aria-hidden="true"><div id="yt"></div></div>
<div class="yay" id="yay">Yayyy!! 🥳💖</div>

<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const easeOut=x=>1-(1-x)*(1-x);
const backOut=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const R=d=>d*Math.PI/180;
const setT=(id,v)=>{const e=$(id);if(e)e.setAttribute('transform',v)};
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const SKIN='#fbe0cc',SKIN_D='#f0c4a8',HAIR='#2a1c14';
const HEART='M0 -4 C-2 -10 -11 -9 -11 -2 C-11 5 -3 9 0 13 C3 9 11 5 11 -2 C11 -9 2 -10 0 -4Z';

/* split the title into bouncy letters */
(()=>{const h=$('ttl');const words=h.textContent.split(' ');h.innerHTML=words.map((w,wi)=>
  '<span class="w">'+[...w].map((c,i)=>`<span class="l" style="animation-delay:${(wi*5+i)*0.08}s">${c}</span>`).join('')+'</span>').join(' ')})();

/* ---------- landscape pieces ---------- */
function range(pts,rock,snow,snowY,amp,id,shadeOp=.12,hi=0){
  const d='M'+pts.map(p=>p.join(' ')).join(' L')+' L1600 900 L0 900 Z';
  let sl=`M0 ${snowY}`;
  for(let x=0,i=0;x<=1620;x+=12+rnd()*22,i++) sl+=` L${x.toFixed(0)} ${(snowY+(i%2?amp*(.5+rnd()*1.1):-amp*(.15+rnd()*.6))).toFixed(0)}`;
  sl+=' L1600 900 L0 900 Z';
  let sh='';
  for(let i=1;i<pts.length-1;i++){const[px,py]=pts[i];
    if(py<pts[i-1][1]&&py<pts[i+1][1]){const[nx,ny]=pts[i+1],[qx,qy]=pts[i-1];
      sh+=`<path d="M${px} ${py} L${nx} ${ny} L${nx} 900 L${px+(nx-px)*.3} 900Z" fill="#1d2b4a" opacity="${shadeOp}"/>`;
      if(hi)sh+=`<path d="M${px} ${py} L${qx} ${qy} L${qx} 900 L${px-(px-qx)*.15} 900Z" fill="#fff" opacity="${hi}"/>`}}
  return `<clipPath id="${id}"><path d="${sl}"/></clipPath><clipPath id="${id}m"><path d="${d}"/></clipPath>
   <path d="${d}" fill="${snow}"/><path d="${d}" fill="${rock}" clip-path="url(#${id})"/>
   <g clip-path="url(#${id}m)">${sh}</g>`;
}
function tea(clip,x1,x2,y1,y2,gap){let s=`<g clip-path="url(#${clip})"><rect x="${x1}" y="${y1-gap}" width="${x2-x1}" height="${y2-y1+gap*2}" fill="#9c7448"/>`;
  for(let y=y1;y<y2;y+=gap){const d=`M${x1} ${y} C${x1+(x2-x1)*.3} ${y-10} ${x1+(x2-x1)*.7} ${y+8} ${x2} ${y}`;
    s+=`<path d="${d}" stroke="#2c6e2f" stroke-width="${(gap*.72).toFixed(1)}" fill="none"/>`+
       `<path d="${d}" stroke="#3f9a3c" stroke-width="${(gap*.78).toFixed(1)}" stroke-dasharray="0 ${(gap*.62).toFixed(1)}" stroke-linecap="round" fill="none" transform="translate(0 -1)"/>`+
       `<path d="${d}" stroke="#7fd06a" stroke-width="${(gap*.3).toFixed(1)}" stroke-dasharray="0 ${(gap*.62).toFixed(1)}" stroke-linecap="round" fill="none" transform="translate(-1 -${(gap*.22).toFixed(1)})"/>`}
  return s+'</g>'}
function teaSign(x,y){return `<g transform="translate(${x} ${y})"><rect x="-2.5" y="-46" width="5" height="46" fill="#6b4423"/><rect x="-46" y="-62" width="92" height="24" rx="5" fill="#8a5a2b" stroke="#5a3518" stroke-width="2"/><text x="0" y="-45" text-anchor="middle" style="font:800 13px 'Baloo 2',sans-serif" fill="#fff6d6">Tea Garden 🍃</text></g>`}
function shadeTree(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-2" y="-74" width="4" height="74" fill="#7a5a3a"/><path d="M0 -50 L-14 -64 M0 -58 L12 -70" stroke="#7a5a3a" stroke-width="2"/><ellipse cx="-4" cy="-76" rx="28" ry="9" fill="#3d8b45"/><ellipse cx="8" cy="-84" rx="20" ry="7" fill="#4c9a4f"/></g>`}
function pine(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3" y="-10" width="6" height="12" fill="#6b4423"/><path d="M0 -62 L15 -36 L7 -36 L20 -10 L-20 -10 L-7 -36 L-15 -36Z" fill="#2e7a4c"/><path d="M0 -62 L15 -36 L7 -36 L20 -10 L2 -10Z" fill="#256640"/></g>`}
function rhodo(x,y,s){let d='';for(let i=0;i<9;i++)d+=`<circle cx="${(rnd()*36-18).toFixed(0)}" cy="${(-28-rnd()*24).toFixed(0)}" r="3.2" fill="${rnd()<.5?'#e3243b':'#ff5d73'}"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3" y="-22" width="6" height="24" fill="#6b4423"/><circle cx="0" cy="-38" r="20" fill="#3f8d4b"/><circle cx="-14" cy="-28" r="14" fill="#3f8d4b"/><circle cx="14" cy="-28" r="14" fill="#36803f"/>${d}</g>`}
function flower(x,y,s,c){let p='';for(let i=0;i<5;i++){const a=R(i*72-90);p+=`<circle cx="${(Math.cos(a)*5).toFixed(1)}" cy="${(Math.sin(a)*5).toFixed(1)}" r="4.6" fill="${c}"/>`}
  return `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) scale(${s.toFixed(2)})"><path d="M0 2 L0 17" stroke="#3c8a3c" stroke-width="2"/><ellipse cx="4" cy="12" rx="4" ry="2" fill="#4fa04a"/>${p}<circle r="3" fill="${c==='#ffd166'?'#f08c00':'#ffe066'}"/></g>`}
function win(x,y,w,h){let l='';for(let i=1;i<3;i++){l+=`<line x1="${x+3+(w-6)*i/3}" y1="${y+3}" x2="${x+3+(w-6)*i/3}" y2="${y+h-3}" stroke="#b07a3e" stroke-width="1.6"/><line x1="${x+3}" y1="${y+3+(h-6)*i/3}" x2="${x+w-3}" y2="${y+3+(h-6)*i/3}" stroke="#b07a3e" stroke-width="1.6"/>`}
  return `<rect x="${x-5}" y="${y-6}" width="${w+10}" height="6" rx="1" fill="#6b4423"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#5a3518"/><rect x="${x+3}" y="${y+3}" width="${w-6}" height="${h-6}" fill="#24150b"/>${l}<rect x="${x-3}" y="${y+h}" width="${w+6}" height="4" fill="#6b4423"/>`}
function flags(x1,y1,cx,cy,x2,y2,n){const C=['#2f6fd6','#ffffff','#e23b3b','#2fa84f','#ffd23f'];
  let s=`<path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" stroke="#7a5a3a" stroke-width="1.5" fill="none"/>`;
  for(let i=1;i<=n;i++){const t=i/(n+1),x=(1-t)**2*x1+2*(1-t)*t*cx+t*t*x2,y=(1-t)**2*y1+2*(1-t)*t*cy+t*t*y2;
    s+=`<rect class="flag" style="animation-delay:${(-i*.23).toFixed(2)}s" x="${(x-5).toFixed(1)}" y="${y.toFixed(1)}" width="10" height="13" fill="${C[(i-1)%5]}" stroke="rgba(0,0,0,.18)" stroke-width=".6"/>`}
  return s}

function house(){
  let bal='';for(let x=814;x<=946;x+=8)bal+=`<line x1="${x}" y1="388" x2="${x}" y2="404" stroke="#6b4423" stroke-width="3"/>`;
  return `<g>
  <ellipse cx="880" cy="473" rx="105" ry="8" fill="#000" opacity=".13"/>
  <rect x="818" y="356" width="124" height="52" fill="#f6eedc"/>
  <rect x="806" y="410" width="148" height="60" fill="#f6eedc"/>
  <rect x="806" y="446" width="148" height="24" fill="#b5502f"/>
  <rect x="800" y="466" width="160" height="7" fill="#8a7a6a"/>
  ${win(824,420,22,22)}${win(914,420,22,22)}
  <rect x="862" y="416" width="36" height="6" fill="#6b4423"/>
  <rect x="866" y="422" width="28" height="47" fill="#4a2c14"/><line x1="880" y1="422" x2="880" y2="469" stroke="#2b190b" stroke-width="2"/>
  <circle cx="876" cy="447" r="1.8" fill="#d9a441"/><circle cx="884" cy="447" r="1.8" fill="#d9a441"/>
  <rect x="796" y="404" width="168" height="8" fill="#5a3518"/>

  else if(t<6.2)bx=250;

  else bx=K.bx;
  const ph=t*10,sw=walking?Math.sin(ph):0,bob=walking?-Math.abs(Math.sin(ph))*4:0;
  const idle=t>12?Math.sin(t*1.6):0;

  const kis=t<8.8?0:t<10.8?ease(seg(t,8.8,9.4)):1-ease(seg(t,10.8,11.4));

  let armF=-55+sw*4;
  if(t>=3.5)armF=lerp(-55,-85,ease(seg(t,3.5,4.5)));
  if(t>=5.3)armF=lerp(-85,-6,ease(seg(t,5.3,6)));
  if(t>=7)armF=lerp(-6,-74,hug);
  const bLean=lerp(3*hug,K.bL,kis)+idle*1.5, bHead=lerp(5*hug,K.bH,kis)+idle*2-8*kn;

  setT('cBarmF',`rotate(${armF.toFixed(1)} 20 -140)`);setT('cBarmB',`rotate(${(walking?-sw*20:4).toFixed(1)} -20 -140)`);

  let armS=6+Math.sin(t*2)*2;

  if(t>=5.3)armS=lerp(50,15,ease(seg(t,5.3,6)));
  if(t>=7)armS=lerp(15,82,hug);
  const armSB=lerp(-4,-34,hug);
  const sLean=lerp(-3*hug,K.sL,kis)-idle*1.5, sHead=lerp(-8*hug,K.sH,kis)-((hug||kis)?0:Math.sin(t*1.3)*1.5);
  setT('cS',`translate(${SX} ${FY}) scale(${S_SC})`);
  setT('cSup',`rotate(${sLean.toFixed(2)} 0 -84)`);
  setT('cShead',`rotate(${sHead.toFixed(2)} 0 -158)`);setT('cShair',`rotate(${sHead.toFixed(2)} 0 -158)`);
  setT('cSarmF',`rotate(${armS.toFixed(1)} -18 -142)`);setT('cSarmB',`rotate(${armSB.toFixed(1)} 18 -142)`);

  const sClosed=hug>.6||kis>.3||(t%3.7<.13), bClosed=hug>.6||kis>.3||((t+1.4)%4.1<.13);
  $('cSeyeO').setAttribute('opacity',sClosed?0:1);$('cSeyeC').setAttribute('opacity',sClosed?1:0);
  $('cBeyeO').setAttribute('opacity',bClosed?0:1);$('cBeyeC').setAttribute('opacity',bClosed?1:0);

  // bouquet: his hand -> her hand -> held behind her back during the hug
  const hb=[bx+20-56*Math.sin(R(armF)),FY+bob+drop-140+56*Math.cos(R(armF))];
  const frontArm=t>=7?15:armS;
  const hsF=herW([-18-54*Math.sin(R(frontArm)),-142+54*Math.cos(R(frontArm))],sLean);
  const hsB=herW([18-54*Math.sin(R(armSB)),-142+54*Math.cos(R(armSB))],sLean);
  const hs=[lerp(hsF[0],hsB[0],hug),lerp(hsF[1],hsB[1],hug)];
  const p=ease(seg(t,4.5,5.3));
  setT('bq',`translate(${lerp(hb[0],hs[0],p).toFixed(1)} ${lerp(hb[1],hs[1],p).toFixed(1)}) rotate(${(lerp(12,-8,p)+sLean*p+18*hug).toFixed(1)})`);

  // dogs
  const happy=(t>7.3&&t<11.3);
  const hop=happy?-Math.abs(Math.sin(t*9))*14:0, hop2=happy?-Math.abs(Math.sin(t*9+1.2))*14:0;

  setT('dog2',`translate(505 ${(FY+hop2).toFixed(1)}) scale(-1 1)`);

  // speech bubbles
  const o1=seg(t,3.6,3.9)*(1-seg(t,5.4,5.7)), o2=seg(t,5.7,6)*(1-seg(t,6.9,7.2));

  $('bub2').setAttribute('opacity',o2);setT('bub2',`translate(425 62) scale(${(.7+.3*seg(t,5.7,6)).toFixed(2)})`);

  once('h1',5.3,()=>svgHearts($('cast'),hsF[0],hsF[1]-40,10));

let lastDodge=0;
function dodge(e){

  const now=performance.now();if(now-lastDodge<280)return;lastDodge=now;tries++;
  const r=no.getBoundingClientRect();funnyBurst(r.left+r.width/2,r.top+r.height/2,innerWidth<600?4:6);

  const c=[];for(let a=0;a<9;a++)for(let b=0;b<4;b++)c.push([xMin+(xMax-xMin)*a/8,yMin+(yMax-yMin)*b/3]);
  const clear=([x,y])=>!(x<yr.right+12&&x+nr.width>yr.left-12&&y<yr.bottom+10&&y+nr.height>yr.top-10);
  let ok=c.filter(q=>clear(q)&&Math.hypot(q[0]-nr.left,q[1]-nr.top)>nr.width*.5);
  if(!ok.length)ok=c.filter(clear);
  if(!ok.length){const ycx=(yr.left+yr.right)/2;ok=[[ycx<(card.left+card.right)/2?xMax:xMin,yMax]]}

function burst(n){
  const E=['💖','💗','🌸','🐶','🌹','✨','💕','🥳','🐕','🌷'];
  for(let i=0;i<n;i++){const s=document.createElement('div');s.className='burst';s.textContent=E[i%E.length];document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,d=150+Math.random()*Math.max(innerWidth,innerHeight)*.55;
    s.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(${1+Math.random()}) rotate(${Math.random()*360}deg)`,opacity:0}],
      {duration:1600+Math.random()*1200,easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish=()=>s.remove()}
}
let wentYes=false;
function goYes(){
  if(wentYes)return;wentYes=true;playSong();
  ask.style.opacity=0;no.style.display='none';
  burst(70);$('yay').classList.add('on');
  setTimeout(()=>burst(40),600);
  setTimeout(()=>{$('yay').classList.remove('on');$('s1').classList.add('hidden');$('s2').classList.remove('hidden');startScene2()},2400);
}

let t2=null,lastDH=0;
function frame2(now){
  if(t2===null)t2=now;const t=(now-t2)/1000;
  const by=Math.sin(t*1.5)*5,br=Math.sin(t*1.1)*1.3;
  setT('boatG',`translate(800 ${(762+by).toFixed(1)}) rotate(${br.toFixed(2)})`);
  const sw=Math.sin(t*1.3),b=-Math.abs(Math.cos(t*1.3))*3;
  setT('dancers',`translate(${(sw*6).toFixed(1)} 0) rotate(${(sw*4).toFixed(2)} 0 -4)`);
  setT('dB',`translate(-40 ${(-2+b).toFixed(1)})`);
  setT('dSwrap',`translate(40 ${(-2+b).toFixed(1)}) scale(.96)`);
  const st=sw*6;
  setT('dBlegL',`rotate(${st.toFixed(1)} -10 -80)`);setT('dBlegR',`rotate(${(-st).toFixed(1)} 10 -80)`);
  setT('dSlegL',`rotate(${(-st).toFixed(1)} -9 -84)`);setT('dSlegR',`rotate(${st.toFixed(1)} 9 -84)`);
  setT('dBup','rotate(5 0 -80)');setT('dBhead',`rotate(${(9+sw*2).toFixed(1)} 0 -156)`);
  setT('dSup','rotate(-5 0 -84)');const hh=(-12-sw*2).toFixed(1);setT('dShead',`rotate(${hh} 0 -158)`);setT('dShair',`rotate(${hh} 0 -158)`);
  setT('dBarmF',`rotate(${(-58+sw*3).toFixed(1)} 20 -140)`);setT('dBarmB','rotate(12 -20 -140)');
  setT('dSarmF',`rotate(${(118-sw*3).toFixed(1)} -18 -142)`);setT('dSarmB','rotate(-14 18 -142)');
  const sc=Math.sin(t*.8)>-.2, bc=Math.sin(t*.8+1)>.3;
  $('dSeyeO').setAttribute('opacity',sc?0:1);$('dSeyeC').setAttribute('opacity',sc?1:0);
  $('dBeyeO').setAttribute('opacity',bc?0:1);$('dBeyeC').setAttribute('opacity',bc?1:0);
  if(t-lastDH>1.8){lastDH=t;svgHearts($('bg2'),800+sw*6,762+by-215,3,90)}
  requestAnimationFrame(frame2);
}
